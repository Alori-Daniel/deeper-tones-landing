# Checks every pull request and gives it its own preview URL.
#
# The checks are advisory: main is not protected, so a red PR can still be merged. But merging deploys production
# straight away (deploy.yml), so treat red as "do not merge yet".
#
# - Lint, typecheck, build: every PR.
# - Quality (live guides): PRs that touch the site (content, public, src, the guide/figure build, the checker).
# - Quality (draft guides): only when the PR adds or edits a guide marked `draft: true`; runs the new-guide checks
#   (quality/ACCEPTANCE-WAVE.md, WA1–WA4) on just those guides.
# - Preview: uploads a version of the preview Worker with drafts shown, at
#   https://pr-<n>-deeper-tones-landing-preview.<subdomain>.workers.dev, and posts the link on the PR.
#   Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (README → CI and deploys); until they exist this
#   job goes red, which is expected. PRs from forks never get the secrets, so their preview job is red too.
name: PR checks

on:
  pull_request:

# A new push to the PR replaces the run for the previous push.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # -eo pipefail, so a failing command piped into tee still fails the step.
    shell: bash

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Production build (no drafts)
        run: npx opennextjs-cloudflare build
        env:
          GUIDES_REQUIRE_INSHORT: "1"

  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.diff.outputs.quality }}
      drafts: ${{ steps.diff.outputs.drafts }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        run: |
          # HEAD is GitHub's merge of the PR into the current base, and HEAD^1 is that base, so this is exactly what
          # the PR changes (base.sha from the event can be older than the base the merge was made from).
          changed=$(git diff --name-only HEAD^1 HEAD)
          printf 'Changed files:\n%s\n' "$changed"

          # A here-string, not a pipe: with pipefail, grep -q closing the pipe early could fail a long printf.
          if grep -qE '^(content/|public/|src/|assets/|scripts/build-guides\.mjs$|scripts/figures/|tools/quality/|quality/|package(-lock)?\.json$|next\.config\.|open-next\.config\.|wrangler\.jsonc$|\.github/workflows/pr\.yml$)' <<<"$changed"; then
            echo "quality=true" >> "$GITHUB_OUTPUT"
          else
            echo "quality=false" >> "$GITHUB_OUTPUT"
          fi

          # Guides the PR adds or edits (the .md or its figure sources) that are still drafts.
          slugs=$(printf '%s\n' "$changed" | sed -nE 's#^content/guides/([a-z0-9-]+)\.md$#\1#p; s#^content/figures-src/([a-z0-9-]+)/.*#\1#p' | sort -u)
          drafts=""
          for s in $slugs; do
            f="content/guides/$s.md"
            if [ -f "$f" ] && grep -qE '^draft:[[:space:]]*true[[:space:]]*$' "$f"; then drafts="${drafts:+$drafts,}$s"; fi
          done
          echo "drafts=$drafts" >> "$GITHUB_OUTPUT"
          echo "Draft guides in this PR: ${drafts:-none}"

  quality-live:
    name: Quality (live guides)
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium (Playwright and Lighthouse)
        run: npx playwright install --with-deps chromium
      # Lighthouse performance is noisy on shared runners: a page under 90 is measured up to 3 times, best score counts.
      - name: npm run quality
        run: npm run quality -- --out quality-out --lighthouse-runs 3
      - name: Summary
        if: always()
        run: node tools/quality/ci-summary.mjs quality-out/checks.json "Quality (live guides)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-live
          path: quality-out
          retention-days: 14
          if-no-files-found: ignore

  quality-drafts:
    name: Quality (draft guides)
    needs: changes
    if: needs.changes.outputs.drafts != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium (Playwright and Lighthouse)
        run: npx playwright install --with-deps chromium
      # Source URLs: a page that is gone (404/410, no DNS) fails; a site blocking robots or briefly down (403/429/5xx)
      # is a WARN listed in the summary, to open in a browser.
      - name: npm run quality on the draft guides
        env:
          DRAFTS: ${{ needs.changes.outputs.drafts }}
        run: npm run quality -- --include-drafts --only "$DRAFTS" --skip-self-test --out quality-drafts --lighthouse-runs 3
      - name: Summary
        if: always()
        run: node tools/quality/ci-summary.mjs quality-drafts/checks.json "Quality (draft guides)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-drafts
          path: quality-drafts
          retention-days: 14
          if-no-files-found: ignore

  preview:
    name: Preview
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    # The Cloudflare secrets are given only to the steps that need them (not to npm ci or the build), so a new
    # dependency's install script in a PR never sees them. Wrangler reads them from the environment; never printed.
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check the Cloudflare secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set (or this PR is from a fork). See README → CI and deploys."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build with drafts shown
        env:
          GUIDES_SHOW_DRAFTS: "1"
          GUIDES_REQUIRE_INSHORT: "1"
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "$SHA" > public/build.txt
          npx opennextjs-cloudflare build
      # A version upload does not change what the main preview URL serves; it only gets its own alias URL.
      # (OpenNext splits a --message that has spaces, so the version is labelled with --tag instead.)
      - id: upload
        name: Upload a preview version for this PR
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx opennextjs-cloudflare upload --env preview --preview-alias "pr-$PR" --tag "pr-$PR" 2>&1 | tee upload.log
          url=$(grep -oE 'Version Preview Alias URL: https://[^ ]+' upload.log | sed 's/^Version Preview Alias URL: //' | head -1)
          if [ -z "$url" ]; then echo "::error::the upload printed no alias URL"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke check the preview
        env:
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/smoke.mjs "$URL" --expect-build "$SHA"
      - name: Post or update the preview link on the PR
        uses: actions/github-script@v8
        env:
          URL: ${{ steps.upload.outputs.url }}
          DRAFTS: ${{ needs.changes.outputs.drafts }}
        with:
          script: |
            const marker = "<!-- deepertones-preview -->";
            const { URL: url, DRAFTS: drafts } = process.env;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const draftLinks = drafts ? drafts.split(",").map((s) => `- [${s}](${url}/guides/${s})`).join("\n") : "";
            const body = [
              marker,
              `**Preview:** ${url}`,
              "",
              `Built from ${sha}, with draft guides shown (they carry a "Draft, not yet reviewed" banner and noindex).`,
              draftLinks && `\nDraft guides in this PR:\n${draftLinks}`,
            ].filter(Boolean).join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
