<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Moisturise while skin is damp</title>
  <defs>
    <!-- House style tokens: see quality/ART_DIRECTION.md -->
    <linearGradient id="epi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B98058"/><stop offset="1" stop-color="#A46B46"/></linearGradient>
    <linearGradient id="derm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBCBB8"/><stop offset="1" stop-color="#F4E2D7"/></linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F3FB"/><stop offset="1" stop-color="#EFE6F7"/></linearGradient>
    <linearGradient id="obj" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9CFE5"/><stop offset="0.35" stop-color="#E9E2F1"/><stop offset="1" stop-color="#CFC3DE"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F3EFF7"/><stop offset="0.3" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6DEEF"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBDDF7"/><stop offset="1" stop-color="#DCC8F0"/></linearGradient>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#2B1640" flood-opacity="0.10"/></filter>
    <filter id="liftsm" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2B1640" flood-opacity="0.16"/></filter>
    <filter id="seal" x="-10%" y="-60%" width="120%" height="220%"><feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#2B1640" flood-opacity="0.16"/></filter>
    <!-- one panel: 432 x 600, corners 40 -->
    <clipPath id="card"><rect x="0" y="0" width="432" height="600" rx="40"/></clipPath>
    <!-- a drop of water, centred on its round end -->
    <path id="drop" d="M0 -34 C 9 -20, 20 -8, 20 5 C 20 17, 11 25, 0 25 C -11 25, -20 17, -20 5 C -20 -8, -9 -20, 0 -34 Z"/>
    <!-- the same skin in every panel: surface near y = 400, top layer to y = 520, deeper layer below -->
    <g id="skin">
      <rect x="0" y="500" width="432" height="100" fill="url(#derm)"/>
      <path d="M0 404 C 90 392, 180 414, 270 402 C 340 393, 390 400, 432 396 L 432 524 C 330 516, 230 530, 130 520 C 80 516, 40 520, 0 522 Z" fill="url(#epi)"/>
      <path d="M0 404 C 90 392, 180 414, 270 402 C 340 393, 390 400, 432 396" fill="none" stroke="#CF9A72" stroke-width="6"/>
      <path d="M0 522 C 40 520, 80 516, 130 520 C 230 530, 330 516, 432 524" fill="none" stroke="#94603F" stroke-width="5" opacity="0.55"/>
      <g fill="none" stroke="#D7AE97" stroke-width="4" stroke-linecap="round" opacity="0.6">
        <path d="M48 566 C 108 552, 168 576, 228 560"/>
        <path d="M284 584 C 324 572, 364 590, 404 578"/>
      </g>
    </g>
    <!-- a thin film of water lying on the surface -->
    <path id="film" d="M0 398 C 90 386, 180 408, 270 396 C 340 387, 390 394, 432 390 L 432 400 C 390 404, 340 397, 270 406 C 180 418, 90 396, 0 408 Z" fill="#9D4EDD"/>
  </defs>

  <rect width="1600" height="1200" fill="#FFFFFF"/>
  <text x="96" y="150" font-family="Source Serif 4" font-weight="600" font-size="88" fill="#141414" letter-spacing="-1">Moisturise while skin is damp</text>

  <!-- three lifted panels -->
  <g filter="url(#lift)">
    <rect x="96" y="224" width="432" height="600" rx="40" fill="url(#air)"/>
    <rect x="584" y="224" width="432" height="600" rx="40" fill="url(#air)"/>
    <rect x="1072" y="224" width="432" height="600" rx="40" fill="url(#air)"/>
  </g>

  <!-- 1. Wash gently: water falls from a shower onto the skin -->
  <g transform="translate(96 224)">
    <g clip-path="url(#card)">
      <use href="#skin"/>
      <!-- shower arm from the wall, and the head -->
      <g filter="url(#liftsm)">
        <rect x="216" y="64" width="240" height="28" rx="14" fill="#C6B8DA"/>
        <rect x="202" y="64" width="28" height="64" rx="14" fill="#C6B8DA"/>
        <path d="M 176 124 Q 216 112 256 124 L 300 184 Q 216 204 132 184 Z" fill="url(#obj)"/>
      </g>
      <ellipse cx="216" cy="186" rx="84" ry="16" fill="#BBAAD2"/>
      <g fill="#FFFFFF">
        <circle cx="168" cy="186" r="5"/><circle cx="200" cy="189" r="5"/><circle cx="232" cy="189" r="5"/><circle cx="264" cy="186" r="5"/>
      </g>
      <!-- falling water -->
      <g fill="#9D4EDD">
        <use href="#drop" transform="translate(150 262) scale(0.9)"/>
        <use href="#drop" transform="translate(204 248)"/>
        <use href="#drop" transform="translate(262 266) scale(0.9)"/>
        <use href="#drop" transform="translate(176 336) scale(0.8)"/>
        <use href="#drop" transform="translate(236 330) scale(0.85)"/>
        <use href="#drop" transform="translate(292 344) scale(0.75)"/>
      </g>
    </g>
  </g>

  <!-- 2. Pat dry, leave damp: a towel lifts off, a film of water stays on the skin -->
  <g transform="translate(584 224)">
    <g clip-path="url(#card)">
      <use href="#skin"/>
      <use href="#film"/>
      <g fill="#9D4EDD">
        <path d="M108 396 C 108 382, 118 374, 130 374 C 142 374, 152 382, 152 394 Z"/>
        <path d="M290 398 C 290 386, 298 380, 308 380 C 318 380, 326 386, 326 396 Z"/>
      </g>
      <!-- folded towel -->
      <g transform="translate(216 240) rotate(-6)">
        <g filter="url(#liftsm)">
          <rect x="-150" y="-4" width="300" height="70" rx="30" fill="#CFC3DE"/>
          <rect x="-160" y="-66" width="320" height="86" rx="34" fill="url(#obj)"/>
        </g>
        <rect x="88" y="-66" width="16" height="86" fill="#BBAAD2"/>
        <rect x="116" y="-66" width="10" height="86" fill="#BBAAD2"/>
        <rect x="88" y="20" width="16" height="46" fill="#B3A1CB"/>
        <rect x="116" y="20" width="10" height="46" fill="#B3A1CB"/>
      </g>
    </g>
  </g>

  <!-- 3. Seal it in: a layer of cream or ointment over the damp skin, the jar above -->
  <g transform="translate(1072 224)">
    <g clip-path="url(#card)">
      <use href="#skin"/>
      <use href="#film"/>
      <g filter="url(#seal)">
        <path d="M0 344 C 60 338, 110 348, 150 342 C 168 318, 196 304, 216 314 C 232 322, 218 338, 244 344 C 300 352, 380 338, 432 336 L 432 391 C 390 394, 340 387, 270 396 C 180 408, 90 386, 0 398 Z" fill="url(#cream)"/>
      </g>
      <path d="M0 352 C 60 346, 110 356, 156 348 C 176 326, 198 318, 214 326 C 226 334, 222 348, 244 352 C 300 360, 380 346, 432 344" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
      <g fill="#9D4EDD" opacity="0.55">
        <path d="M108 396 C 108 382, 118 374, 130 374 C 142 374, 152 382, 152 394 Z"/>
        <path d="M290 398 C 290 386, 298 380, 308 380 C 318 380, 326 386, 326 396 Z"/>
      </g>
      <!-- jar -->
      <g transform="translate(216 164)">
        <g filter="url(#liftsm)">
          <rect x="-112" y="-20" width="224" height="124" rx="48" fill="url(#body)"/>
          <rect x="-104" y="-74" width="208" height="62" rx="24" fill="url(#obj)"/>
        </g>
        <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9">
          <path d="M-72 -62 V -24"/><path d="M-36 -62 V -24"/><path d="M0 -62 V -24"/><path d="M36 -62 V -24"/><path d="M72 -62 V -24"/>
        </g>
        <rect x="-76" y="12" width="152" height="64" rx="20" fill="#F1EAF8"/>
        <rect x="-44" y="36" width="88" height="16" rx="8" fill="#D9CFE5"/>
      </g>
    </g>
  </g>

  <!-- pins -->
  <g font-family="Archivo" font-weight="600" font-size="48" text-anchor="middle" fill="#FFFFFF">
    <circle cx="160" cy="288" r="36" fill="#7B2CBF"/><text x="160" y="305">1</text>
    <circle cx="648" cy="288" r="36" fill="#7B2CBF"/><text x="648" y="305">2</text>
    <circle cx="1136" cy="288" r="36" fill="#7B2CBF"/><text x="1136" y="305">3</text>
  </g>

  <!-- labels: the guide's own step names -->
  <g font-family="Archivo" font-weight="600" font-size="58" fill="#141414" text-anchor="middle">
    <text x="312" y="912">Wash</text>
    <text x="312" y="980">gently</text>
    <text x="800" y="912">Pat dry,</text>
    <text x="800" y="980">leave damp</text>
    <text x="1288" y="912">Seal it in</text>
  </g>
  <g font-family="Archivo" font-weight="400" font-size="56" fill="#5E5E5E" text-anchor="middle">
    <text x="1288" y="980">with cream</text>
    <text x="1288" y="1048">or ointment</text>
  </g>
</svg>
