<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="675" fill="#f1f1f1"/>
  <text x="40" y="72" font-size="42" font-weight="700" fill="#141414">Niacinamide: is a higher percentage better?</text>
  <rect x="40" y="110" width="360" height="455" rx="22" fill="#ffffff" stroke="#5e5e5e" stroke-width="3"/>
  <text x="68" y="215" font-size="84" font-weight="700" fill="#141414">2%</text>
  <text x="68" y="300" font-size="28" fill="#141414">Did not clearly beat</text>
  <text x="68" y="340" font-size="28" fill="#141414">plain moisturiser</text>
  <text x="68" y="380" font-size="28" fill="#141414">for spots</text>
  <text x="68" y="444" font-size="28" fill="#141414">Has been used to</text>
  <text x="68" y="484" font-size="28" fill="#141414">support the barrier</text>
  <text x="68" y="524" font-size="28" fill="#141414">in eczema-prone skin</text>
  <rect x="420" y="110" width="360" height="455" rx="22" fill="#ffffff" stroke="#9d4edd" stroke-width="6"/>
  <text x="448" y="215" font-size="84" font-weight="700" fill="#7b2cbf">4 to 5%</text>
  <text x="448" y="262" font-size="28" font-weight="700" fill="#7b2cbf">Most spot evidence</text>
  <text x="448" y="318" font-size="28" fill="#141414">Strengths used in</text>
  <text x="448" y="358" font-size="28" fill="#141414">most spot trials</text>
  <text x="448" y="422" font-size="28" fill="#141414">5% reduced spots</text>
  <text x="448" y="462" font-size="28" fill="#141414">at 4 and 8 weeks</text>
  <rect x="800" y="110" width="360" height="455" rx="22" fill="#ffffff" stroke="#5e5e5e" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="828" y="215" font-size="84" font-weight="700" fill="#141414">10%</text>
  <text x="828" y="300" font-size="28" fill="#141414">No spot trial in</text>
  <text x="828" y="340" font-size="28" fill="#141414">the main review</text>
  <text x="828" y="404" font-size="28" fill="#141414">One skin test found</text>
  <text x="828" y="444" font-size="28" fill="#141414">no stinging or flushing</text>
  <text x="40" y="614" font-size="30" fill="#141414">A bigger number has not been shown to work better.</text>
  <text x="40" y="654" font-size="30" font-weight="700" fill="#141414">Look for roughly 4 to 5% on the label.</text>
</svg>
