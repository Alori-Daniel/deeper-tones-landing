<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Bigger is not proven better</title>
  <defs>
    <linearGradient id="obj" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9CFE5"/><stop offset="0.35" stop-color="#E9E2F1"/><stop offset="1" stop-color="#CFC3DE"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F3EFF7"/><stop offset="0.3" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECE6F2"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#EFE4F8"/><stop offset="1" stop-color="#EFE4F8" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-80%" y="-200%" width="260%" height="500%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="lift" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2B1640" flood-opacity="0.09"/></filter>
  </defs>
  <rect width="1600" height="1200" fill="#FFFFFF"/>
  <text x="96" y="150" font-family="Source Serif 4" font-weight="600" font-size="88" fill="#141414" letter-spacing="-1">Bigger is not proven better</text>

  <!-- the strength most spot trials used gets the soft glow -->
  <circle cx="800" cy="560" r="300" fill="url(#glow)"/>

  <!-- the same bottle three times; only the number on the label changes -->
  <g transform="translate(322 0)">
    <ellipse cx="0" cy="774" rx="128" ry="16" fill="#2B1640" opacity="0.08" filter="url(#soft)"/>
    <g filter="url(#lift)">
      <rect x="-20" y="356" width="40" height="40" fill="#D9CFE5"/>
      <rect x="-38" y="300" width="76" height="120" rx="38" fill="#CFC3DE"/>
      <rect x="-58" y="420" width="116" height="52" rx="12" fill="url(#obj)"/>
      <rect x="-112" y="464" width="224" height="300" rx="48" fill="url(#body)"/>
    </g>
    <path d="M -96 500 C -102 560, -102 680, -96 736" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <rect x="-98" y="552" width="196" height="124" rx="24" fill="#F1EAF8"/>
    <text x="0" y="638" font-family="Source Serif 4" font-weight="600" font-size="72" fill="#141414" text-anchor="middle">2%</text>
  </g>
  <g transform="translate(800 0)">
    <ellipse cx="0" cy="774" rx="128" ry="16" fill="#2B1640" opacity="0.08" filter="url(#soft)"/>
    <g filter="url(#lift)">
      <rect x="-20" y="356" width="40" height="40" fill="#D9CFE5"/>
      <rect x="-38" y="300" width="76" height="120" rx="38" fill="#CFC3DE"/>
      <rect x="-58" y="420" width="116" height="52" rx="12" fill="url(#obj)"/>
      <rect x="-112" y="464" width="224" height="300" rx="48" fill="url(#body)"/>
    </g>
    <path d="M -96 500 C -102 560, -102 680, -96 736" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <rect x="-98" y="552" width="196" height="124" rx="24" fill="#F1EAF8"/>
    <text x="0" y="638" font-family="Source Serif 4" font-weight="600" font-size="72" fill="#7B2CBF" text-anchor="middle">4–5%</text>
  </g>
  <g transform="translate(1278 0)">
    <ellipse cx="0" cy="774" rx="128" ry="16" fill="#2B1640" opacity="0.08" filter="url(#soft)"/>
    <g filter="url(#lift)">
      <rect x="-20" y="356" width="40" height="40" fill="#D9CFE5"/>
      <rect x="-38" y="300" width="76" height="120" rx="38" fill="#CFC3DE"/>
      <rect x="-58" y="420" width="116" height="52" rx="12" fill="url(#obj)"/>
      <rect x="-112" y="464" width="224" height="300" rx="48" fill="url(#body)"/>
    </g>
    <path d="M -96 500 C -102 560, -102 680, -96 736" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <rect x="-98" y="552" width="196" height="124" rx="24" fill="#F1EAF8"/>
    <text x="0" y="638" font-family="Source Serif 4" font-weight="600" font-size="72" fill="#141414" text-anchor="middle">10%</text>
  </g>

  <g font-family="Archivo" text-anchor="middle">
    <text x="322" y="892" font-size="58" font-weight="600" fill="#141414">Not clearly better</text>
    <text x="322" y="960" font-size="56" font-weight="400" fill="#5E5E5E">than moisturiser</text>
    <text x="800" y="892" font-size="58" font-weight="600" fill="#7B2CBF">Most spot trials</text>
    <text x="1278" y="892" font-size="58" font-weight="600" fill="#141414">No spot trial</text>
    <text x="1278" y="960" font-size="56" font-weight="400" fill="#5E5E5E">in the main review</text>
  </g>
</svg>
