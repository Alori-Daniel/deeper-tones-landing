<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Read the back, not the front</title>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EFE4F8"/>
      <stop offset="1" stop-color="#EFE4F8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9CFE5"/>
      <stop offset="0.35" stop-color="#E9E2F1"/>
      <stop offset="1" stop-color="#CFC3DE"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3EFF7"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECE6F2"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#2B1640" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="#FFFFFF"/>

  <text x="96" y="150" font-family="Source Serif 4" font-weight="600" font-size="88" fill="#141414" letter-spacing="-1">Read the back, not the front</text>

  <!-- FRONT: an invented, unbranded jar -->
  <circle cx="288" cy="760" r="300" fill="url(#glow)"/>
  <g filter="url(#lift)">
    <rect x="116" y="548" width="344" height="104" rx="28" fill="url(#lid)"/>
    <rect x="96" y="630" width="384" height="360" rx="72" fill="url(#body)"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="5" opacity="0.6">
    <path d="M168 566 V 640"/><path d="M212 566 V 640"/><path d="M256 566 V 640"/><path d="M300 566 V 640"/><path d="M344 566 V 640"/><path d="M388 566 V 640"/><path d="M432 566 V 640"/>
  </g>
  <rect x="132" y="700" width="312" height="220" rx="32" fill="#F1EAF8"/>
  <text x="288" y="806" font-family="Source Serif 4" font-weight="600" font-size="84" fill="#141414" text-anchor="middle" letter-spacing="4">GLOW</text>
  <text x="288" y="876" font-family="Archivo" font-weight="400" font-size="56" fill="#5E5E5E" text-anchor="middle">fast action</text>
  <path d="M118 700 C 112 780, 112 860, 122 930" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- BACK: the label that matters -->
  <g filter="url(#lift)">
    <rect x="536" y="232" width="968" height="900" rx="40" fill="#FFFFFF"/>
  </g>
  <rect x="536" y="232" width="968" height="900" rx="40" fill="none" stroke="#ECE8F0" stroke-width="2"/>

  <g font-family="Archivo">
    <text x="600" y="326" font-size="56" font-weight="600" fill="#141414">Ingredients</text>
    <!-- ordinary ingredients, shown as quiet placeholder lines -->
    <rect x="600" y="368" width="760" height="22" rx="11" fill="#ECE8F0"/>
    <rect x="600" y="410" width="520" height="22" rx="11" fill="#ECE8F0"/>

    <!-- the three names to look for -->
    <rect x="580" y="462" width="428" height="80" rx="20" fill="#EFE4F8"/>
    <text x="604" y="522" font-size="58" font-weight="600" fill="#141414">Hydroquinone</text>
    <text x="1036" y="522" font-size="56" font-weight="400" fill="#7B2CBF">lightening agent</text>

    <rect x="580" y="562" width="652" height="80" rx="20" fill="#EFE4F8"/>
    <text x="604" y="622" font-size="58" font-weight="600" fill="#141414">Clobetasol propionate</text>
    <text x="1260" y="622" font-size="56" font-weight="400" fill="#7B2CBF">steroid</text>

    <rect x="580" y="662" width="262" height="80" rx="20" fill="#EFE4F8"/>
    <text x="604" y="722" font-size="58" font-weight="600" fill="#141414">Calomel</text>
    <text x="870" y="722" font-size="56" font-weight="400" fill="#7B2CBF">mercury</text>

    <rect x="600" y="784" width="380" height="22" rx="11" fill="#ECE8F0"/>

    <path d="M600 852 H 1440" stroke="#ECE8F0" stroke-width="3"/>

    <!-- what else to check on the back -->
    <g>
      <circle cx="622" cy="922" r="22" fill="#7B2CBF"/>
      <path d="M611 922 l 8 8 l 15 -16" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="664" y="942" font-size="56" font-weight="400" fill="#141414">NAFDAC No.</text>
      <rect x="1100" y="912" width="300" height="22" rx="11" fill="#ECE8F0"/>

      <circle cx="622" cy="1002" r="22" fill="#7B2CBF"/>
      <path d="M611 1002 l 8 8 l 15 -16" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="664" y="1022" font-size="56" font-weight="400" fill="#141414">Batch, expiry</text>
      <rect x="1100" y="992" width="220" height="22" rx="11" fill="#ECE8F0"/>

      <circle cx="622" cy="1082" r="22" fill="#7B2CBF"/>
      <path d="M611 1082 l 8 8 l 15 -16" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="664" y="1102" font-size="56" font-weight="400" fill="#141414">Maker, country</text>
      <rect x="1100" y="1072" width="260" height="22" rx="11" fill="#ECE8F0"/>
    </g>
  </g>
</svg>
