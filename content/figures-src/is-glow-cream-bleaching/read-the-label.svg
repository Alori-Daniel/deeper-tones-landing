<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#f1f1f1"/>
  <text x="60" y="68" font-size="44" font-weight="700" fill="#141414">Reading a glow cream label</text>
  <text x="60" y="124" font-size="28" font-weight="700" fill="#7b2cbf">FRONT</text>
  <text x="600" y="124" font-size="28" font-weight="700" fill="#7b2cbf">BACK</text>

  <!-- front label (invented, unbranded) -->
  <rect x="60" y="140" width="460" height="210" rx="28" fill="#ffffff" stroke="#9d4edd" stroke-width="4"/>
  <text x="290" y="228" font-size="52" font-weight="700" text-anchor="middle" fill="#141414">GLOW CREAM</text>
  <text x="290" y="288" font-size="32" text-anchor="middle" fill="#5e5e5e">fast action</text>
  <text x="60" y="410" font-size="30" fill="#141414">Words on the front cannot</text>
  <text x="60" y="450" font-size="30" fill="#141414">show what is inside.</text>

  <text x="60" y="545" font-size="30" font-weight="700" fill="#141414">On the back, look for:</text>
  <text x="60" y="590" font-size="30" fill="#141414">The ingredient list</text>
  <text x="60" y="633" font-size="30" fill="#141414">A registration number</text>
  <text x="60" y="676" font-size="30" fill="#141414">Batch, maker, dates</text>

  <!-- back label -->
  <rect x="600" y="140" width="540" height="520" rx="28" fill="#ffffff" stroke="#9d4edd" stroke-width="4"/>
  <text x="634" y="196" font-size="30" font-weight="700" fill="#141414">Ingredients:</text>
  <text x="634" y="244" font-size="30" fill="#141414">Aqua, Glycerin, Cetyl Alcohol,</text>
  <rect x="624" y="262" width="260" height="46" rx="8" fill="#7b2cbf"/>
  <text x="634" y="296" font-size="30" font-weight="700" fill="#ffffff">Hydroquinone,</text>
  <rect x="624" y="318" width="360" height="46" rx="8" fill="#e0a020"/>
  <text x="634" y="352" font-size="30" font-weight="700" fill="#141414">Clobetasol Propionate,</text>
  <rect x="624" y="374" width="190" height="46" rx="8" fill="#d64545"/>
  <text x="634" y="408" font-size="30" font-weight="700" fill="#ffffff">Calomel,</text>
  <text x="634" y="454" font-size="30" fill="#141414">Parfum</text>

  <line x1="634" y1="490" x2="1106" y2="490" stroke="#5e5e5e" stroke-width="2"/>
  <text x="634" y="540" font-size="30" fill="#141414">NAFDAC No.: 00-0000</text>
  <text x="634" y="584" font-size="30" fill="#141414">Batch 0000 · Exp 00/00</text>
  <text x="634" y="628" font-size="30" fill="#141414">Made by: Company, Country</text>

  <text x="60" y="728" font-size="30" fill="#141414">Mercury: stop using it. Steroid, used long: get advice to stop.</text>
  <text x="60" y="772" font-size="30" fill="#5e5e5e">An invented label. A clean list is reassuring, not proof.</text>
</svg>
