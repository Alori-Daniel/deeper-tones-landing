<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Close shaves can trap curly hair</title>
  <defs>
    <linearGradient id="epi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B98058"/>
      <stop offset="1" stop-color="#A46B46"/>
    </linearGradient>
    <linearGradient id="derm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBCBB8"/>
      <stop offset="1" stop-color="#F4E2D7"/>
    </linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF7FC"/>
      <stop offset="1" stop-color="#F1EAF8"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2B1640" flood-opacity="0.09"/>
    </filter>
    <clipPath id="cardL"><rect x="96" y="420" width="680" height="700" rx="40"/></clipPath>
    <clipPath id="cardR"><rect x="824" y="420" width="680" height="700" rx="40"/></clipPath>
  </defs>

  <rect width="1600" height="1200" fill="#FFFFFF"/>

  <text x="96" y="150" font-family="Source Serif 4" font-weight="600" font-size="88" fill="#141414" letter-spacing="-1">Close shaves can trap curly hair</text>

  <!-- ===== Left: shaved very close (avoid) ===== -->
  <g font-family="Archivo">
    <circle cx="126" cy="272" r="30" fill="#5E5E5E"/>
    <path d="M114 260 l 24 24 M138 260 l -24 24" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <text x="176" y="292" font-size="58" font-weight="600" fill="#141414">Shaved very close</text>
    <text x="96" y="370" font-size="56" font-weight="400" fill="#5E5E5E">Tip curls back in</text>
  </g>

  <g filter="url(#lift)"><rect x="96" y="420" width="680" height="700" rx="40" fill="url(#air)"/></g>
  <g clip-path="url(#cardL)">
    <!-- dermis -->
    <rect x="96" y="840" width="680" height="300" fill="url(#derm)"/>
    <!-- follicle sheath -->
    <path d="M300 1080 C 312 980, 336 890, 368 790" fill="none" stroke="#E2B9A0" stroke-width="44" stroke-linecap="round"/>
    <!-- epidermis with a raised bump where the tip goes back in -->
    <path d="M96 760 L 500 760 C 530 760, 540 712, 590 712 C 640 712, 650 760, 680 760 L 776 760 L 776 852 C 600 846, 400 858, 96 848 Z" fill="url(#epi)"/>
    <path d="M96 760 L 500 760 C 530 760, 540 712, 590 712 C 640 712, 650 760, 680 760 L 776 760" fill="none" stroke="#CF9A72" stroke-width="6"/>
    <!-- the skin reacts around the tip: a soft darker area, same hue -->
    <ellipse cx="590" cy="770" rx="74" ry="40" fill="#6E3A22" opacity="0.75" filter="url(#soft)"/>
    <!-- hair: in the follicle, out of the skin, and back in with a sharp tip -->
    <path d="M302 1070 C 314 970, 342 870, 378 762 C 400 690, 450 640, 512 640 C 572 640, 600 690, 592 744" fill="none" stroke="#2E1C12" stroke-width="11" stroke-linecap="round"/>
    <path d="M592 744 L 586 790" fill="none" stroke="#2E1C12" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
    <path d="M588 788 L 584 806" fill="none" stroke="#2E1C12" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- ===== Right: clippers with a guard (do) ===== -->
  <g font-family="Archivo">
    <circle cx="854" cy="272" r="30" fill="#7B2CBF"/>
    <path d="M840 272 l 10 10 l 19 -20" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="904" y="292" font-size="58" font-weight="600" fill="#141414">Clippers with a guard</text>
    <text x="824" y="370" font-size="56" font-weight="400" fill="#5E5E5E">Tip more likely stays out</text>
  </g>

  <g filter="url(#lift)"><rect x="824" y="420" width="680" height="700" rx="40" fill="url(#air)"/></g>
  <g clip-path="url(#cardR)">
    <rect x="824" y="840" width="680" height="300" fill="url(#derm)"/>
    <path d="M1028 1080 C 1040 980, 1064 890, 1096 790" fill="none" stroke="#E2B9A0" stroke-width="44" stroke-linecap="round"/>
    <path d="M824 760 L 1504 760 L 1504 852 C 1328 846, 1128 858, 824 848 Z" fill="url(#epi)"/>
    <path d="M824 760 L 1504 760" fill="none" stroke="#CF9A72" stroke-width="6"/>
    <!-- hair left long enough, blunt cut end, curving away from the skin -->
    <path d="M1030 1070 C 1042 970, 1070 870, 1106 762 C 1118 714, 1146 676, 1176 648" fill="none" stroke="#2E1C12" stroke-width="11" stroke-linecap="butt"/>
  </g>
  <!-- clipper head with its guard: the comb holds the blade off the skin -->
  <defs>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4DCEC"/>
      <stop offset="1" stop-color="#CFC3DD"/>
    </linearGradient>
  </defs>
  <g filter="url(#lift)">
    <rect x="930" y="520" width="290" height="64" rx="24" fill="url(#clip)"/>
  </g>
  <g fill="#D6CCE2">
    <rect x="944" y="572" width="16" height="62" rx="8"/><rect x="980" y="572" width="16" height="62" rx="8"/><rect x="1016" y="572" width="16" height="62" rx="8"/><rect x="1052" y="572" width="16" height="62" rx="8"/><rect x="1088" y="572" width="16" height="62" rx="8"/><rect x="1124" y="572" width="16" height="62" rx="8"/><rect x="1160" y="572" width="16" height="62" rx="8"/><rect x="1196" y="572" width="16" height="62" rx="8"/>
  </g>
  <!-- length marker: at least 1 mm of hair left -->
  <g stroke="#7B2CBF" stroke-width="5" stroke-linecap="round">
    <path d="M1236 644 V 756"/>
    <path d="M1220 644 H 1252"/>
    <path d="M1220 756 H 1252"/>
  </g>
  <text x="1276" y="718" font-family="Archivo" font-size="58" font-weight="600" fill="#7B2CBF">1 mm+</text>
</svg>
