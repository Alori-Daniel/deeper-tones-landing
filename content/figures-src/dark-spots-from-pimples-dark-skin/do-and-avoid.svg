<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Leave the spots alone</title>
  <defs>
    <linearGradient id="epi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B98058"/>
      <stop offset="1" stop-color="#A46B46"/>
    </linearGradient>
    <linearGradient id="derm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBCBB8"/>
      <stop offset="1" stop-color="#F4E2D7"/>
    </linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF7FC"/>
      <stop offset="1" stop-color="#F1EAF8"/>
    </linearGradient>
    <linearGradient id="finger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B98058"/>
      <stop offset="0.45" stop-color="#C8916A"/>
      <stop offset="1" stop-color="#B98058"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2B1640" flood-opacity="0.09"/>
    </filter>
    <filter id="fingershade" x="-40%" y="-20%" width="180%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2B1640" flood-opacity="0.12"/>
    </filter>
    <clipPath id="cardL"><rect x="96" y="420" width="680" height="700" rx="40"/></clipPath>
    <clipPath id="cardR"><rect x="824" y="420" width="680" height="700" rx="40"/></clipPath>
    <!-- one skin slab with a pimple, drawn once and placed in both panels -->
    <g id="slab">
      <rect x="0" y="840" width="680" height="300" fill="url(#derm)"/>
      <path d="M70 1060 C 90 1000, 100 960, 130 910" fill="none" stroke="#D7AE97" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
      <path d="M520 1060 C 540 1000, 560 960, 600 900" fill="none" stroke="#D7AE97" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
      <!-- the pore under the pimple -->
      <path d="M340 1060 C 342 990, 342 920, 340 820" fill="none" stroke="#E2B9A0" stroke-width="44" stroke-linecap="round"/>
      <!-- top layer, raised where the pimple sits -->
      <path d="M0 780 L 236 780 C 270 780, 280 700, 340 700 C 400 700, 410 780, 444 780 L 680 780 L 680 872 C 500 866, 300 878, 0 868 Z" fill="url(#epi)"/>
      <path d="M0 780 L 236 780 C 270 780, 280 700, 340 700 C 400 700, 410 780, 444 780 L 680 780" fill="none" stroke="#CF9A72" stroke-width="6"/>
      <path d="M0 868 C 300 878, 500 866, 680 872" fill="none" stroke="#94603F" stroke-width="4" opacity="0.55"/>
      <!-- the inflamed pimple: a soft darker area, same hue -->
      <ellipse cx="340" cy="772" rx="64" ry="40" fill="#6E3A22" opacity="0.7" filter="url(#soft)"/>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="#FFFFFF"/>

  <text x="96" y="150" font-family="Source Serif 4" font-weight="600" font-size="88" fill="#141414" letter-spacing="-1">Leave the spots alone</text>

  <!-- ===== Left: picking or squeezing (avoid) ===== -->
  <g font-family="Archivo">
    <circle cx="126" cy="272" r="30" fill="#5E5E5E"/>
    <path d="M114 260 l 24 24 M138 260 l -24 24" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <text x="176" y="292" font-size="58" font-weight="600" fill="#141414">Picking or squeezing</text>
    <text x="96" y="370" font-size="56" font-weight="400" fill="#5E5E5E">Adds more inflammation</text>
  </g>

  <g filter="url(#lift)"><rect x="96" y="420" width="680" height="700" rx="40" fill="url(#air)"/></g>
  <g clip-path="url(#cardL)">
    <use href="#slab" x="96" y="0"/>
    <!-- squeezing spreads the inflammation wider and deeper -->
    <ellipse cx="436" cy="800" rx="150" ry="62" fill="#6E3A22" opacity="0.55" filter="url(#soft)"/>
    <!-- two fingertips pinching the spot -->
    <g filter="url(#fingershade)">
      <g transform="translate(352 704) rotate(-34)">
        <rect x="-56" y="-560" width="112" height="616" rx="56" fill="url(#finger)"/>
        <rect x="-50" y="-112" width="30" height="120" rx="15" fill="#E6C6B0" opacity="0.9"/>
      </g>
      <g transform="translate(520 704) rotate(34)">
        <rect x="-56" y="-560" width="112" height="616" rx="56" fill="url(#finger)"/>
        <rect x="20" y="-112" width="30" height="120" rx="15" fill="#E6C6B0" opacity="0.9"/>
      </g>
    </g>
  </g>

  <!-- ===== Right: keep it clean, let it settle (do) ===== -->
  <g font-family="Archivo">
    <circle cx="854" cy="272" r="30" fill="#7B2CBF"/>
    <path d="M840 272 l 10 10 l 19 -20" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="904" y="292" font-size="58" font-weight="600" fill="#141414">Keep it clean</text>
    <text x="824" y="370" font-size="56" font-weight="400" fill="#5E5E5E">Let it settle</text>
  </g>

  <g filter="url(#lift)"><rect x="824" y="420" width="680" height="700" rx="40" fill="url(#air)"/></g>
  <g clip-path="url(#cardR)">
    <use href="#slab" x="824" y="0"/>
  </g>
</svg>
