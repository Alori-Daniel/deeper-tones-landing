<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Names to look for on a label</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9E2F1"/><stop offset="1" stop-color="#CFC3DE"/></linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9CFE5"/><stop offset="1" stop-color="#CFC3DE"/></linearGradient>
    <radialGradient id="glass" cx="0.5" cy="0.5" r="0.5"><stop offset="0.75" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F1FB"/></radialGradient>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2B1640" flood-opacity="0.09"/></filter>
    <filter id="lens" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#2B1640" flood-opacity="0.12"/></filter>
    <clipPath id="glassclip"><circle cx="528" cy="690" r="290"/></clipPath>
  </defs>
  <rect width="1600" height="1200" fill="#FFFFFF"/>
  <text x="96" y="150" font-family="Source Serif 4" font-weight="600" font-size="88" fill="#141414" letter-spacing="-1">Names to look for on a label</text>

  <!-- the back label: small print as placeholder bars -->
  <g filter="url(#lift)"><rect x="96" y="248" width="864" height="872" rx="40" fill="#FFFFFF"/></g>
  <rect x="96" y="248" width="864" height="872" rx="40" fill="none" stroke="#ECE8F0" stroke-width="2"/>
  <rect x="160" y="316" width="440" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="364" width="600" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="412" width="640" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="460" width="480" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="508" width="520" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="556" width="520" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="604" width="600" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="652" width="560" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="700" width="520" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="748" width="440" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="796" width="560" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="844" width="520" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="892" width="560" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="940" width="600" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="988" width="520" height="16" rx="8" fill="#ECE8F0"/><rect x="160" y="1036" width="520" height="16" rx="8" fill="#ECE8F0"/>

  <!-- the magnifier: handle, lens, and the enlarged names inside -->
  <path d="M296 922 L 190 1028" stroke="url(#handle)" stroke-width="60" stroke-linecap="round"/>
  <g filter="url(#lens)"><circle cx="528" cy="690" r="308" fill="url(#ring)"/></g>
  <circle cx="528" cy="690" r="290" fill="url(#glass)"/>
  <g clip-path="url(#glassclip)">
    <rect x="308" y="444" width="400" height="26" rx="13" fill="#ECE8F0"/><rect x="308" y="902" width="420" height="26" rx="13" fill="#ECE8F0"/><rect x="308" y="950" width="280" height="26" rx="13" fill="#ECE8F0"/>
    <rect x="284" y="514" width="274" height="88" rx="20" fill="#EFE4F8"/><rect x="284" y="644" width="348" height="88" rx="20" fill="#EFE4F8"/><rect x="284" y="774" width="452" height="88" rx="20" fill="#EFE4F8"/>
    <text x="308" y="582" font-family="Archivo" font-weight="600" font-size="64" fill="#141414">calomel</text><text x="308" y="712" font-family="Archivo" font-weight="600" font-size="64" fill="#141414">clobetasol</text><text x="308" y="842" font-family="Archivo" font-weight="600" font-size="64" fill="#141414">hydroquinone</text>
  </g>
  <path d="M328 520 A 262 262 0 0 1 488 432" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- what each name is -->
  <path d="M582 560 H 1000" stroke="#7B2CBF" stroke-width="5" stroke-linecap="round"/><path d="M656 690 H 1000" stroke="#7B2CBF" stroke-width="5" stroke-linecap="round"/><path d="M760 820 H 1000" stroke="#7B2CBF" stroke-width="5" stroke-linecap="round"/>
  <text x="1024" y="580" font-family="Archivo" font-weight="400" font-size="56" fill="#7B2CBF">mercury</text><text x="1024" y="710" font-family="Archivo" font-weight="400" font-size="56" fill="#7B2CBF">steroid</text><text x="1024" y="840" font-family="Archivo" font-weight="400" font-size="56" fill="#7B2CBF">lightening agent</text>
</svg>
