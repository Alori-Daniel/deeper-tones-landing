<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#f1f1f1"/>
  <text x="40" y="72" font-size="42" font-weight="700" fill="#141414">Read the label, not the name</text>

  <!-- label card -->
  <rect x="40" y="110" width="560" height="640" rx="24" fill="#ffffff" stroke="#c9c9c9" stroke-width="3"/>
  <text x="70" y="168" font-size="34" font-weight="700" fill="#141414">TONING CREAM</text>
  <rect x="70" y="190" width="500" height="64" rx="12" fill="#e0a020"/>
  <text x="95" y="234" font-size="32" font-weight="700" fill="#141414">Whitens in days</text>

  <text x="70" y="318" font-size="28" font-weight="700" fill="#5e5e5e">Ingredients</text>
  <text x="70" y="372" font-size="30" fill="#141414">Aqua, Glycerin, Cetyl Alcohol</text>

  <rect x="62" y="396" width="516" height="52" rx="10" fill="#d64545" fill-opacity="0.18" stroke="#d64545" stroke-width="3"/>
  <text x="80" y="433" font-size="30" font-weight="700" fill="#141414">Mercurous Chloride</text>

  <rect x="62" y="470" width="516" height="52" rx="10" fill="#d64545" fill-opacity="0.18" stroke="#d64545" stroke-width="3"/>
  <text x="80" y="507" font-size="30" font-weight="700" fill="#141414">Clobetasol Propionate</text>

  <rect x="62" y="544" width="516" height="52" rx="10" fill="#d64545" fill-opacity="0.18" stroke="#d64545" stroke-width="3"/>
  <text x="80" y="581" font-size="30" font-weight="700" fill="#141414">Hydroquinone</text>

  <text x="70" y="636" font-size="30" fill="#141414">Tocopherol, Parfum</text>
  <text x="70" y="716" font-size="28" fill="#5e5e5e">Invented label, not a real product</text>

  <!-- connectors -->
  <line x1="570" y1="222" x2="640" y2="222" stroke="#e0a020" stroke-width="5"/>
  <line x1="578" y1="422" x2="640" y2="422" stroke="#d64545" stroke-width="5"/>
  <path d="M578 496 H610 V570 H578" fill="none" stroke="#d64545" stroke-width="5"/>
  <line x1="610" y1="533" x2="640" y2="533" stroke="#d64545" stroke-width="5"/>

  <!-- callout: claim -->
  <rect x="640" y="150" width="520" height="140" rx="16" fill="#ffffff" stroke="#e0a020" stroke-width="4"/>
  <text x="664" y="198" font-size="30" font-weight="700" fill="#141414">Promises to whiten</text>
  <text x="664" y="238" font-size="30" fill="#141414">or work in days?</text>
  <text x="664" y="274" font-size="30" fill="#141414">Be wary.</text>

  <!-- callout: mercury -->
  <rect x="640" y="316" width="520" height="190" rx="16" fill="#ffffff" stroke="#d64545" stroke-width="4"/>
  <text x="664" y="360" font-size="30" font-weight="700" fill="#141414">Mercury has other names:</text>
  <text x="664" y="402" font-size="28" fill="#141414">calomel, mercuric,</text>
  <text x="664" y="440" font-size="28" fill="#141414">mercurio, Hg</text>
  <text x="664" y="486" font-size="30" font-weight="700" fill="#d64545">Put it down.</text>

  <!-- callout: steroid + hydroquinone -->
  <rect x="640" y="530" width="520" height="220" rx="16" fill="#ffffff" stroke="#d64545" stroke-width="4"/>
  <text x="664" y="576" font-size="30" font-weight="700" fill="#141414">Steroids (clobetasol,</text>
  <text x="664" y="614" font-size="30" font-weight="700" fill="#141414">betamethasone) or</text>
  <text x="664" y="652" font-size="30" font-weight="700" fill="#141414">hydroquinone</text>
  <text x="664" y="714" font-size="28" fill="#141414">Ask a prescriber first.</text>
</svg>
