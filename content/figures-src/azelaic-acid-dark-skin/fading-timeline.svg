      <ellipse cx="262" cy="248" rx="58" ry="40" fill="#6A3B22" opacity="0.85"/>
      <ellipse cx="150" cy="252" rx="44" ry="32" fill="#5E331D" opacity="0.8"/></g><text x="584" y="880" font-family="Archivo" font-weight="600" font-size="58" fill="#141414">Week 12</text><text x="584" y="946" font-family="Archivo" font-weight="400" font-size="56" fill="#7B2CBF">First fair check</text><g filter="url(#lift)"><rect x="1072" y="264" width="432" height="432" rx="44" fill="url(#epi)"/></g><rect x="1072" y="264" width="432" height="432" rx="44" fill="url(#shine)"/><rect x="1075" y="267" width="426" height="426" rx="41" fill="none" stroke="#CF9A72" stroke-width="6" opacity="0.5"/><g opacity="0.32" filter="url(#soft)" transform="translate(1072 264)">
