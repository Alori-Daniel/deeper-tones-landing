<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#f1f1f1"/>
  <text x="60" y="88" font-size="44" font-weight="700" fill="#141414">How long a mark lasts depends on</text>
  <text x="60" y="140" font-size="44" font-weight="700" fill="#141414">where the colour sits</text>

  <!-- skin cross-section: same deep browns throughout -->
  <clipPath id="skin"><rect x="60" y="180" width="1080" height="340" rx="28"/></clipPath>
  <g clip-path="url(#skin)">
    <rect x="60" y="180" width="1080" height="150" fill="#8a5a3c"/>
    <rect x="60" y="330" width="1080" height="190" fill="#6f4a35"/>
    <rect x="60" y="330" width="1080" height="4" fill="#5a3a29"/>
  </g>
  <text x="90" y="226" font-size="30" font-weight="700" fill="#f1f1f1">Top layer of skin</text>
  <text x="90" y="376" font-size="30" font-weight="700" fill="#f1f1f1">Deeper in the skin</text>

  <!-- top-layer mark: a few shades darker than the skin -->
  <ellipse cx="330" cy="278" rx="92" ry="34" fill="#53321f"/>
  <!-- deeper mark: slate blue-grey -->
  <ellipse cx="860" cy="440" rx="92" ry="40" fill="#5b6479"/>

  <!-- callouts -->
  <rect x="60" y="552" width="520" height="220" rx="20" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
  <text x="90" y="600" font-size="34" font-weight="700" fill="#141414">A few shades darker</text>
  <text x="90" y="646" font-size="30" fill="#5e5e5e">Usually fades in</text>
  <text x="90" y="704" font-size="44" font-weight="700" fill="#7b2cbf">6 to 12 months</text>
  <text x="90" y="738" font-size="28" fill="#5e5e5e">once the cause stops</text>

  <rect x="620" y="552" width="520" height="220" rx="20" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
  <text x="650" y="600" font-size="34" font-weight="700" fill="#141414">Slate blue or grey</text>
  <text x="650" y="646" font-size="30" fill="#5e5e5e">Fading can take</text>
  <text x="650" y="704" font-size="44" font-weight="700" fill="#7b2cbf">years</text>
</svg>
