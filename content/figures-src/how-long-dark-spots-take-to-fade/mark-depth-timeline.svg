<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Deeper marks take longer to fade</title>
  <defs>
    <!-- House style tokens: see quality/ART_DIRECTION.md -->
    <linearGradient id="epi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B98058"/>
      <stop offset="1" stop-color="#A46B46"/>
    </linearGradient>
    <linearGradient id="derm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBCBB8"/>
      <stop offset="1" stop-color="#F4E2D7"/>
    </linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F3FB"/>
      <stop offset="1" stop-color="#EFE6F7"/>
    </linearGradient>
    <linearGradient id="yearsFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9D4EDD"/>
      <stop offset="0.55" stop-color="#9D4EDD"/>
      <stop offset="1" stop-color="#9D4EDD" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-120%" width="220%" height="340%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softer" x="-60%" y="-120%" width="220%" height="340%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2B1640" flood-opacity="0.10"/>
    </filter>
    <clipPath id="slab">
      <path d="M140 286 C 360 270, 600 300, 820 288 S 1260 272, 1460 288 Q 1504 292 1504 336 L 1504 628 Q 1504 672 1460 672 L 140 672 Q 96 672 96 628 L 96 330 Q 96 290 140 286 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="1200" fill="#FFFFFF"/>

  <!-- Title: Source Serif 4, one line -->
  <text x="96" y="150" font-family="Source Serif 4" font-weight="600" font-size="88" fill="#141414" letter-spacing="-1">Deeper marks take longer to fade</text>

  <!-- Skin cross-section (stylised, not to scale): a floating slab whose top edge is the skin surface -->
  <g filter="url(#lift)">
    <path d="M140 286 C 360 270, 600 300, 820 288 S 1260 272, 1460 288 Q 1504 292 1504 336 L 1504 628 Q 1504 672 1460 672 L 140 672 Q 96 672 96 628 L 96 330 Q 96 290 140 286 Z" fill="url(#derm)"/>
  </g>
  <g clip-path="url(#slab)">
    <!-- faint fibres in the deeper layer -->
    <g fill="none" stroke="#D7AE97" stroke-width="4" stroke-linecap="round" opacity="0.6">
      <path d="M180 530 C 280 510, 380 550, 480 526"/>
      <path d="M560 612 C 660 592, 760 632, 860 608"/>
      <path d="M260 628 C 340 612, 420 638, 500 622"/>
      <path d="M1300 600 C 1370 584, 1420 610, 1470 596"/>
      <path d="M640 510 C 700 496, 760 520, 810 506"/>
    </g>
    <!-- one hair in its follicle, for scale and recognition -->
    <!-- top layer (epidermis): one constant warm brown -->
    <path d="M96 200 L 1504 200 L 1504 432 C 1260 414, 1020 446, 780 432 S 320 414, 96 430 Z" fill="url(#epi)"/>
    <!-- basal line where pigment is made -->
    <path d="M96 430 C 320 414, 540 418, 780 432 C 1020 446, 1260 414, 1504 432" fill="none" stroke="#94603F" stroke-width="5" opacity="0.55"/>
    <!-- surface sheen -->
    <path d="M140 286 C 360 270, 600 300, 820 288 S 1260 272, 1460 288" fill="none" stroke="#CF9A72" stroke-width="6" opacity="0.9"/>
    <!-- mark 1: in the top layer, a few shades darker than the skin -->
    <ellipse cx="470" cy="352" rx="118" ry="34" fill="#6A3B22" opacity="0.85" filter="url(#soft)"/>
    <ellipse cx="455" cy="350" rx="62" ry="20" fill="#5E331D" opacity="0.6" filter="url(#soft)"/>
    <!-- mark 2: deeper, slate blue-grey -->
    <ellipse cx="1130" cy="548" rx="150" ry="56" fill="#76809A" opacity="0.9" filter="url(#softer)"/>
    <ellipse cx="1110" cy="540" rx="80" ry="30" fill="#66708A" opacity="0.7" filter="url(#soft)"/>
  </g>
  <!-- one hair in its follicle, for recognition; drawn over the layers -->
  <ellipse cx="846" cy="606" rx="17" ry="21" fill="#B8805F"/>
  <path d="M846 596 C 838 520, 836 440, 852 360 C 862 314, 876 270, 906 214" fill="none" stroke="#3B2417" stroke-width="7" stroke-linecap="round"/>

  <!-- Pins on the marks -->
  <g font-family="Archivo" font-weight="600" font-size="48" text-anchor="middle" fill="#FFFFFF">
    <circle cx="470" cy="248" r="36" fill="#7B2CBF"/>
    <text x="470" y="265">1</text>
    <path d="M470 284 L 470 318" stroke="#7B2CBF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1110" cy="248" r="36" fill="#7B2CBF"/>
    <text x="1110" y="265">2</text>
    <path d="M1110 284 L 1110 478" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
    <path d="M1110 284 L 1110 478" stroke="#7B2CBF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Timeline: shared axis. Now -> 6 months -> 1 year -> years -->
  <g font-family="Archivo">
    <!-- axis guides -->
    <g stroke="#E6E1EC" stroke-width="3">
      <path d="M760 752 V 1032"/>
      <path d="M1020 752 V 1032"/>
      <path d="M1280 752 V 1032"/>
    </g>

    <!-- row 1 -->
    <circle cx="132" cy="806" r="36" fill="#7B2CBF"/>
    <text x="132" y="823" font-size="48" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="192" y="826" font-size="58" font-weight="600" fill="#141414">Top layer</text>
    <text x="192" y="892" font-size="56" font-weight="400" fill="#5E5E5E">a few shades darker</text>
    <rect x="760" y="842" width="744" height="28" rx="14" fill="#F1EAF8"/>
    <rect x="1020" y="842" width="260" height="28" rx="14" fill="#9D4EDD"/>
    <text x="1020" y="814" font-family="Source Serif 4" font-weight="600" font-size="64" fill="#7B2CBF">6–12 months</text>

    <!-- row 2 -->
    <circle cx="132" cy="986" r="36" fill="#7B2CBF"/>
    <text x="132" y="1003" font-size="48" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="192" y="1006" font-size="58" font-weight="600" fill="#141414">Deeper</text>
    <text x="192" y="1072" font-size="56" font-weight="400" fill="#5E5E5E">slate blue or grey</text>
    <rect x="760" y="1022" width="744" height="28" rx="14" fill="#F1EAF8"/>
    <rect x="1280" y="1022" width="224" height="28" rx="14" fill="url(#yearsFade)"/>
    <text x="1280" y="994" font-family="Source Serif 4" font-weight="600" font-size="64" fill="#7B2CBF">years</text>

    <!-- axis labels -->
    <g font-size="56" fill="#5E5E5E" text-anchor="middle">
      <text x="760" y="1120">now</text>
      <text x="1020" y="1120">6 months</text>
      <text x="1280" y="1120">1 year</text>
    </g>
  </g>
</svg>
