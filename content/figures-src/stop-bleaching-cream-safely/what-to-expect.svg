<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Recovery takes months, not days</title>
  <defs>
    <linearGradient id="epi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B98058"/><stop offset="1" stop-color="#A46B46"/></linearGradient>
    <linearGradient id="derm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBCBB8"/><stop offset="1" stop-color="#F4E2D7"/></linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAF7FC"/><stop offset="1" stop-color="#F1EAF8"/></linearGradient>
    <linearGradient id="air2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <filter id="soft" x="-80%" y="-200%" width="260%" height="500%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2B1640" flood-opacity="0.09"/></filter>
    <clipPath id="tile1"><rect x="800" y="264" width="664" height="168" rx="28"/></clipPath>
    <clipPath id="epi1"><path d="M800 348 Q 800 320 828 320 L 1436 320 Q 1464 320 1464 348 L 1464 392 C 1300 386, 1060 398, 800 390 Z"/></clipPath>
    <clipPath id="tile2"><rect x="800" y="544" width="664" height="168" rx="28"/></clipPath>
    <clipPath id="epi2"><path d="M800 628 Q 800 600 828 600 L 1436 600 Q 1464 600 1464 628 L 1464 672 C 1300 666, 1060 678, 800 670 Z"/></clipPath>
    <clipPath id="tile3"><rect x="800" y="824" width="664" height="168" rx="28"/></clipPath>
    <clipPath id="epi3"><path d="M800 908 Q 800 880 828 880 L 1436 880 Q 1464 880 1464 908 L 1464 952 C 1300 946, 1060 958, 800 950 Z"/></clipPath>
  </defs>
  <rect width="1600" height="1200" fill="#FFFFFF"/>
  <text x="96" y="150" font-family="Source Serif 4" font-weight="600" font-size="88" fill="#141414" letter-spacing="-1">Recovery takes months, not days</text>
  <g filter="url(#lift)"><rect x="96" y="232" width="1408" height="232" rx="40" fill="url(#air)"/></g>
  <circle cx="168" cy="348" r="36" fill="#7B2CBF"/>
  <text x="168" y="365" font-family="Archivo" font-weight="600" font-size="48" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="232" y="340" font-family="Archivo" font-weight="600" font-size="58" fill="#141414">Days to weeks</text>
  <text x="232" y="406" font-family="Archivo" font-weight="400" font-size="56" fill="#5E5E5E">A flare may start</text>
  <g clip-path="url(#tile1)">
    
    <rect x="800" y="384" width="664" height="60" fill="url(#derm)"/>
    <path d="M800 348 Q 800 320 828 320 L 1436 320 Q 1464 320 1464 348 L 1464 392 C 1300 386, 1060 398, 800 390 Z" fill="url(#epi)"/>
    <path d="M828 321 L 1436 321" stroke="#CF9A72" stroke-width="6" fill="none"/>
    <g clip-path="url(#epi1)"><ellipse cx="1132" cy="356" rx="230" ry="34" fill="#6E3A22" opacity="0.85" filter="url(#soft)"/></g>
  </g>
  <g filter="url(#lift)"><rect x="96" y="512" width="1408" height="232" rx="40" fill="url(#air)"/></g>
  <circle cx="168" cy="628" r="36" fill="#7B2CBF"/>
  <text x="168" y="645" font-family="Archivo" font-weight="600" font-size="48" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="232" y="620" font-family="Archivo" font-weight="600" font-size="58" fill="#141414">Weeks to months</text>
  <text x="232" y="686" font-family="Archivo" font-weight="400" font-size="56" fill="#5E5E5E">Skin settles slowly</text>
  <g clip-path="url(#tile2)">
    
    <rect x="800" y="664" width="664" height="60" fill="url(#derm)"/>
    <path d="M800 628 Q 800 600 828 600 L 1436 600 Q 1464 600 1464 628 L 1464 672 C 1300 666, 1060 678, 800 670 Z" fill="url(#epi)"/>
    <path d="M828 601 L 1436 601" stroke="#CF9A72" stroke-width="6" fill="none"/>
    <g clip-path="url(#epi2)"><ellipse cx="1132" cy="636" rx="160" ry="26" fill="#6E3A22" opacity="0.5" filter="url(#soft)"/></g>
  </g>
  <g filter="url(#lift)"><rect x="96" y="792" width="1408" height="232" rx="40" fill="url(#air)"/></g>
  <circle cx="168" cy="908" r="36" fill="#7B2CBF"/>
  <text x="168" y="925" font-family="Archivo" font-weight="600" font-size="48" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="232" y="900" font-family="Archivo" font-weight="600" font-size="58" fill="#141414">Months to years</text>
  <text x="232" y="966" font-family="Archivo" font-weight="400" font-size="56" fill="#5E5E5E">Marks fade slowly</text>
  <g clip-path="url(#tile3)">
    
    <rect x="800" y="944" width="664" height="60" fill="url(#derm)"/>
    <path d="M800 908 Q 800 880 828 880 L 1436 880 Q 1464 880 1464 908 L 1464 952 C 1300 946, 1060 958, 800 950 Z" fill="url(#epi)"/>
    <path d="M828 881 L 1436 881" stroke="#CF9A72" stroke-width="6" fill="none"/>
    <g clip-path="url(#epi3)"><ellipse cx="1132" cy="916" rx="96" ry="20" fill="#6E3A22" opacity="0.26" filter="url(#soft)"/></g>
  </g>
</svg>
