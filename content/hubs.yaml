# The four topic hubs on /guides (docs: quality/ACCEPTANCE-HUBS.md).
#
# Every guide in content/guides/ (draft or not) is listed in exactly one hub; the build fails otherwise.
# Order matters: hubs appear on /guides in this order, and guides inside a hub in the order listed (the hub's lead
# guide first). A hub gets its own page at /guides/topics/<slug> only when it has 3 or more published guides;
# until then it is a section on /guides only.
#
# title: the <title> and og:title of the hub page (60 characters or fewer, before " | Deeper Tones").
# description: meta description of the hub page (70 to 160 characters).
# intro: one or two plain sentences under the hub heading. No health claims: it says what the guides cover.

